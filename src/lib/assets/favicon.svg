<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Michael Larson">
  <!-- rounded dark tile so it reads on both light and dark browser chrome -->
  <rect width="100" height="100" rx="24" fill="#0f172a" />
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the M drawn as a mountain range: open at the bottom so it reads as a
         letter, with sharp peaks and a central valley -->
    <polyline points="18,78 37,24 50,52 63,24 82,78" stroke="#6f9ad6" stroke-width="10" />
    <!-- snow-capped peak tips -->
    <polyline points="34.2,32 37,24 39.6,29.6" stroke="#eef3f8" stroke-width="10" />
    <polyline points="60.4,29.6 63,24 65.8,32" stroke="#eef3f8" stroke-width="10" />
  </g>
</svg>
